<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aitoyz builds AI tools, websites and mobile apps. Explore our products and tell us what you'd like to build.">
    <meta name="theme-color" content="#171b0e">
    <title>Aitoyz - AI, Web & App Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    :root{--accent:#e4f222;--ink:#171b0e;--paper:#fcfcf8;--muted:#51574b;--serif:"Instrument Serif",Georgia,serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid #536000;outline-offset:4px}.nav a:focus-visible{outline-color:var(--accent)}button{font:inherit}
    .skip{position:fixed;top:12px;left:12px;z-index:9;padding:12px;background:white;transform:translateY(-180%)}.skip:focus{transform:none}
    .nav{position:fixed;z-index:5;left:50%;top:0;transform:translateX(-50%);width:min(700px,calc(100% - 24px));min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px;border-radius:0 0 19px 19px;background:#10110d;color:white;box-shadow:0 8px 32px #191e1229}
    .brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(#f9ffbd,var(--accent) 55%,#a5b40f);color:#14180a;font-size:19px;box-shadow:inset 0 1px 1px #fff9}
    .navlinks,.actions,.footerlinks{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,26px)}.navlinks{color:#c9c9bd;font-size:13px}.navlinks a:hover{color:white}.navcta{padding:9px 13px;border-radius:10px;background:white;color:#10110d;font-size:13px;font-weight:700;white-space:nowrap}
    .screen{min-height:100svh;display:grid;align-content:center;padding:clamp(64px,10vh,108px) 24px;text-align:center}.wrap{width:min(1040px,100%);margin-inline:auto}.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#252f09 0%,#647310 24%,#c8d91e 50%,#e4f222 74%,#f0f88b 100%);color:#fffdf4;padding-top:max(86px,14vh);padding-bottom:34px;align-content:start}.hero::after{content:"";z-index:-1;position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,#fcfcf8 99%)}.hero .wrap{position:relative}.eyebrow{margin:0 0 16px;font-size:clamp(14px,2vw,18px);font-weight:600;letter-spacing:-.03em}.hero .eyebrow{color:#fff}
    h1,h2,h3,p{margin:0}h1{font-size:clamp(52px,8.2vw,108px);font-weight:800;line-height:.88;letter-spacing:-.085em;text-shadow:0 2px 18px #24320055}h1 em,h2 em{display:block;font-family:var(--serif);font-weight:400;letter-spacing:-.045em;line-height:.92}h1 em{color:#161c0b;text-shadow:none;margin-top:.09em}h2{font-size:clamp(45px,6.1vw,86px);line-height:.95;letter-spacing:-.075em}h2 em{margin-top:.07em}.lede{max-width:580px;margin:20px auto 0;font-size:clamp(15px,2vw,19px);line-height:1.45;letter-spacing:-.025em;color:var(--muted)}.hero .lede{color:#161c0b;font-weight:600}.actions{margin-top:22px;gap:12px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:47px;padding:10px 19px;border-radius:16px;background:#12140e;color:white;font-size:14px;font-weight:700}.button:hover,.navcta:hover{background:var(--accent);color:#171b0e;box-shadow:0 0 0 1px #171b0e}.button.light{background:white;color:#171b0e}.button.light:hover{background:#f9ffb8}
    .window{max-width:750px;margin:clamp(22px,5vh,52px) auto 0;text-align:left;border:1px solid #fff9;border-radius:20px;background:#171b13;color:#f4f4e8;box-shadow:0 25px 70px #25320e55;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:#262b1e;color:#e6ebd5;font-size:11px}.dots{letter-spacing:3px;color:#e4f222}.bar span:last-child{color:#d4dabd}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:10px}.tile{display:grid;gap:4px;min-width:0;padding:clamp(10px,2vw,18px);border:1px solid #ffffff1f;border-radius:12px;background:#303725}.tile:hover{border-color:var(--accent)}.tile strong{font-size:clamp(12px,2vw,16px)}.tile small{color:#d6ddc2;font-size:11px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:34px;text-align:left}.card{display:grid;align-content:start;gap:10px;padding:20px;background:white;border:1px solid #e5e8d9;border-radius:22px}.card h3{font-size:23px;letter-spacing:-.06em}.card p{font-size:14px;line-height:1.45;color:var(--muted)}.cardlink{display:inline-flex;justify-self:start;align-items:center;min-height:36px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:4px}.visual{height:clamp(92px,20vh,175px);margin-bottom:6px;border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative}.cine{background:radial-gradient(ellipse at 50% 20%,#e7fb97,#729144 45%,#263622 82%)}.screens{display:flex;gap:4px;transform:perspective(400px) rotateX(-9deg);width:76%;height:51%}.screens i{flex:1;border:4px solid #1b2216;border-radius:5px;background:linear-gradient(145deg,#202c39,#8bb1bc 46%,#c4d64f 47%,#455731 70%);box-shadow:0 7px 12px #18261480}.screens i:nth-child(2){transform:translateY(-5px);background-position:50% 10%}.map{background:repeating-linear-gradient(24deg,transparent 0 24px,#edf0be 26px 28px,transparent 30px 53px),repeating-linear-gradient(114deg,#c7d096 0 27px,#edf0be 29px 32px,#b8c387 34px 70px)}.pin{display:grid;place-items:center;width:48px;height:48px;border-radius:50% 50% 50% 10%;transform:rotate(-45deg);background:var(--accent);color:#222810;box-shadow:0 5px 16px #26321766}.pin i{display:block;width:16px;height:16px;border:4px solid currentColor;border-radius:50%}.ingredient{background:radial-gradient(ellipse at top,#fbffc9,#e0e8a3 58%,#a6b370)}.scan{width:63%;padding:11px;border-radius:10px;background:#fffef1;box-shadow:0 8px 20px #36401a44;font-size:10px;font-weight:700}.scan i{display:block;margin-top:6px;height:4px;border-radius:4px;background:#d4dba9}.scan i:last-child{width:67%}
    .services{background:#f0f2e4}.services .card{background:#fafbf3}.symbol{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);font-size:19px;font-weight:800}
    .faq details{text-align:left;background:white;border:1px solid #e4e7d9;border-radius:14px;padding:0 17px}.faq details+details{margin-top:8px}.faq summary{padding:14px 0;cursor:pointer;font-size:15px;font-weight:700}.faq details p{padding:0 0 14px;color:var(--muted);line-height:1.5;font-size:14px}.questions{max-width:640px;margin:28px auto 0}
    .contact{position:relative;background:radial-gradient(ellipse at 50% 0,#f7ffac,transparent 55%),linear-gradient(170deg,#e4f222,#dce953 70%,#eff5ab);padding-bottom:90px}.contact .lede{color:#293213}.footer{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(24px,calc((100% - 1040px)/2));border-top:1px solid #27301533;font-size:13px}.footerlinks{gap:15px}
    @media(max-width:640px){.screen{padding-inline:15px}.nav{gap:8px}.navlinks{gap:10px;font-size:12px}.navcta{font-size:12px;padding:8px}.grid{gap:8px;margin-top:22px}.work .grid,.services .grid{grid-template-columns:1fr}.card{padding:12px;gap:5px;border-radius:15px}.work .card{grid-template-columns:80px 1fr;column-gap:11px}.work .visual{grid-row:1/4;height:100%;min-height:77px;margin:0}.work .cardlink{min-height:30px}.card h3{font-size:19px}.card p{font-size:13px}.services .card{grid-template-columns:36px 1fr;column-gap:10px}.services .symbol{grid-row:1/3;width:34px;height:34px}.hero{align-content:center}.hero .lede{max-width:355px}.window{margin-top:30px}.tile{padding:8px}.tile small{font-size:10px}.footer{padding-inline:15px}}
    @media(max-width:360px){.navlinks a:nth-child(3){display:none}.bar span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    </style>
    <meta property="og:title" content="Aitoyz — AI, Web &amp; App Development">
    <meta property="og:description" content="Aitoyz builds AI tools, websites and mobile apps.">
    <meta property="og:type" content="website">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
